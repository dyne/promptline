name: Promptline CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: make build
      - name: Format and vet
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          make vet
      - name: Unit and protocol contracts
        run: |
          make test-unit
          make test-protocol
          make check-coverage
      - name: Verify dependency and protocol surface
        shell: bash
        run: |
          go mod tidy -diff
          ! go list -deps ./... | grep -E 'go-openai|readline|promptline/internal/chat'
          ! grep -R -nE 'go-openai|github.com/chzyer/readline|ChatCompletion' --include='*.go' --include='go.mod' .
          go test -count=1 ./internal/appserver ./internal/runtime ./internal/governance ./internal/mcp
          ./promptline --version
          ./promptline --help

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .gocache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
      - run: make test-integration

  race-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .gocache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
      - run: make test-race-integration
      - run: make test-stress

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-fuzz-smoke

  debian-sysadmin-skill:
    name: Debian sysadmin skill
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-yaml shellcheck
      - name: Run skill validator
        shell: bash
        run: |
          bash -n plugins/debian-sysadmin/scripts/validate-skill.sh
          plugins/debian-sysadmin/scripts/validate-skill.sh
      - name: Run Skill Creator validation
        run: python3 plugins/debian-sysadmin/scripts/skill_creator_validate.py plugins/debian-sysadmin
      - name: Run ShellCheck
        run: shellcheck plugins/debian-sysadmin/scripts/validate-skill.sh
      - name: Compare toolbox catalog with live MCP schema
        shell: bash
        run: |
          python3 -B plugins/debian-sysadmin/tests/test_toolbox_catalog.py
          go build -trimpath -o "${RUNNER_TEMP}/promptline-catalog-check" ./cmd/promptline
          python3 plugins/debian-sysadmin/scripts/check_toolbox_catalog.py \
            --promptline "${RUNNER_TEMP}/promptline-catalog-check"

  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-${{ matrix.target }}

  semantic-versioning:
    name: 🤖 Semantic versioning
    needs: [build-and-test, integration, race-integration, fuzz-smoke, debian-sysadmin-skill, compile]
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic-release
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binary-releases:
    name: Build binary releases
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [semantic-versioning]
    if: ${{ needs.semantic-versioning.outputs.new_release_published == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Capture Go env
        id: goenv
        shell: bash
        run: |
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          GOEXE=$(go env GOEXE)
          echo "GOOS=$GOOS" >> "$GITHUB_ENV"
          echo "GOARCH=$GOARCH" >> "$GITHUB_ENV"
          echo "GOEXE=$GOEXE" >> "$GITHUB_ENV"
          echo "goos=$GOOS" >> "$GITHUB_OUTPUT"
          echo "goarch=$GOARCH" >> "$GITHUB_OUTPUT"
          echo "goexe=$GOEXE" >> "$GITHUB_OUTPUT"
      - name: Install go deps
        run: go mod download
      - name: Build release
        shell: bash
        run: |
          OUTPUT="promptline-${GOOS}-${GOARCH}${GOEXE}"
          go build -ldflags="-s -w -X main.Version=${{ needs.semantic-versioning.outputs.new_release_version }}" -trimpath -o "$OUTPUT" ./cmd/promptline
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.goenv.outputs.goos }}-${{ steps.goenv.outputs.goarch }}
          path: ./promptline-${{ steps.goenv.outputs.goos }}-${{ steps.goenv.outputs.goarch }}${{ steps.goenv.outputs.goexe }}

  remove-tag-on-fail:
    name: Remove tag on fail
    needs: [semantic-versioning]
    runs-on: ubuntu-latest
    if: ${{ (failure() || cancelled()) && needs.semantic-versioning.outputs.new_release_published == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: ${{ needs.semantic-versioning.outputs.new_release_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: false
          repo: dyne/promptline

  upload-releases:
    name: Upload releases
    needs: [semantic-versioning, binary-releases]
    runs-on: ubuntu-latest
    steps:
      - name: download binary artifacts
        uses: actions/download-artifact@v5
        with:
          path: |
            promptline-bin
      - name: show directory structure
        run: tree -dL 3
      - name: relase all binary artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            promptline-bin/release*/*
          tag_name: ${{ needs.semantic-versioning.outputs.new_release_version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
