name: Promptline CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - run: go mod download
      - run: make build
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          make vet
      - run: make test-unit && make test-protocol && make check-coverage
      - name: Verify dependency and protocol surface
        run: |
          go mod tidy -diff
          ! go list -deps ./... | grep -E 'go-openai|readline|promptline/internal/chat'
          ! grep -R -nE 'go-openai|github.com/chzyer/readline|ChatCompletion' --include='*.go' --include='go.mod' .
          go test -count=1 ./internal/appserver ./internal/runtime ./internal/governance ./internal/mcp
          ./promptline --version
          ./promptline --help

  security-policy:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: make check-go-policy && make check-workflow-policy && python3 scripts/check-workflow-policy.py --self-test
      - run: make vulncheck

  integration:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .gocache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
      - run: make test-integration

  race-integration:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .gocache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
      - run: make test-race-integration
      - run: make test-stress

  fuzz-smoke:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - run: make test-fuzz-smoke

  sysadmin-plugin:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-yaml shellcheck
      - run: bash -n plugins/promptline/skills/debian-sysadmin/scripts/validate-skill.sh && plugins/promptline/skills/debian-sysadmin/scripts/validate-skill.sh
      - run: python3 plugins/promptline/skills/debian-sysadmin/scripts/skill_creator_validate.py plugins/promptline/skills/debian-sysadmin
      - run: go build -trimpath -o "${RUNNER_TEMP}/promptline-plugin-check" ./cmd/promptline && python3 plugins/promptline/scripts/validate_package.py --promptline "${RUNNER_TEMP}/promptline-plugin-check"
      - run: shellcheck install.sh scripts/test-install.sh scripts/check-go-policy.sh scripts/release-dry-run.sh scripts/release-metadata.sh plugins/promptline/skills/debian-sysadmin/scripts/validate-skill.sh
      - run: scripts/test-install.sh
      - run: python3 -B plugins/promptline/skills/debian-sysadmin/tests/test_toolbox_catalog.py && python3 plugins/promptline/skills/debian-sysadmin/scripts/check_toolbox_catalog.py --promptline "${RUNNER_TEMP}/promptline-plugin-check"

  compile:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    strategy: {matrix: {target: [linux, darwin, windows]}}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - run: make build-${{ matrix.target }}

  semantic-versioning:
    needs: [build-and-test, security-policy, integration, race-integration, fuzz-smoke, sysadmin-plugin, compile]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    permissions: {contents: write}
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cycjimmy/semantic-release-action@c4a2fa890676fc2db25ad0aacd8ab4a0f1f4c024 # v4.2.1
        id: semantic-release
        with: {extra_plugins: "@semantic-release/changelog@6.0.3\n@semantic-release/github@11.0.6"}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binary-releases:
    strategy: {matrix: {os: [ubuntu-latest, macos-latest]}}
    runs-on: ${{ matrix.os }}
    needs: [semantic-versioning]
    if: ${{ github.event_name == 'push' && needs.semantic-versioning.outputs.new_release_published == 'true' }}
    permissions: {contents: read, attestations: write, id-token: write}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: .go-version}
      - id: metadata
        run: |
          os=$(go env GOOS); arch=$(go env GOARCH); suffix=$(go env GOEXE); binary="promptline-${os}-${arch}${suffix}"
          go build -trimpath -ldflags="-s -w -X main.Version=${{ needs.semantic-versioning.outputs.new_release_version }}" -o "$binary" ./cmd/promptline
          scripts/release-metadata.sh release "$binary" "${{ needs.semantic-versioning.outputs.new_release_version }}"
          (cd release && shasum -a 256 --check "$(basename "$binary").sha256")
          cp "$binary" release/; echo "binary=release/$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.metadata.outputs.binary }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  remove-tag-on-fail:
    needs: [semantic-versioning, binary-releases]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (failure() || cancelled()) && needs.semantic-versioning.outputs.new_release_published == 'true' }}
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {fetch-depth: 0}
      - uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          tag_name: ${{ needs.semantic-versioning.outputs.new_release_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
          repo: dyne/promptline

  upload-releases:
    needs: [semantic-versioning, binary-releases]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && needs.semantic-versioning.outputs.new_release_published == 'true' }}
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: release-*, path: promptline-bin, merge-multiple: true}
      - run: cd promptline-bin && for checksum in *.sha256; do shasum -a 256 --check "$checksum"; done
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: promptline-bin/*
          tag_name: ${{ needs.semantic-versioning.outputs.new_release_version }}
          fail_on_unmatched_files: true
